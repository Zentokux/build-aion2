<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía · BUILD AION2</title>
<link rel="stylesheet" href="css/estilo.css?v=1">
</head>
<body>
<main id="main"><p>Cargando…</p></main>
<script src="js/comun.js?v=4"></script>
<script src="data/indice.js?v=1"></script>
<script>
(function () {
  var g = param("g");
  cabecera("guias");
  cargarScript("data/guias/" + g + ".js?v=1", function () {
    var G = window.GUIA, main = document.getElementById("main");
    document.title = G.titulo + " · BUILD AION2";
    var misma = (window.INDICE || []).filter(function (x) { return x.categoria === G.categoria && x.slug !== G.slug; });
    main.innerHTML = '<p class="sub"><a href="index.html#' + G.categoria + '">' + esc(CATEGORIAS[G.categoria] || G.categoria) + "</a></p>" +
      "<h1>" + md(G.titulo) + "</h1>" +
      '<div class="panel">' + md(G.resumen) + "</div>" + bloquesHTML(G.bloques) +
      (misma.length ? "<h2>Más de " + esc(CATEGORIAS[G.categoria] || "") + '</h2><div class="rejilla">' + misma.map(function (x) {
        return '<a class="guia-link" href="guia.html?g=' + x.slug + '">' + md(x.titulo) + "<small>" + md(x.resumen) + "</small></a>";
      }).join("") + "</div>" : "");
  }, function () { document.getElementById("main").innerHTML = "<p>No existe esa guía.</p>"; });
})();
</script>
</body>
</html>
