<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de cubos · BUILD AION2</title>
<meta name="description" content="Mapa interactivo de los cubos ocultos de AION 2 en Verteron y Altgard: marca los que ya abriste.">
<link rel="stylesheet" href="css/estilo.css?v=4">
<style>
.mapas { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.boton { background: var(--panel2); color: var(--texto); border: 1px solid var(--borde); border-radius: 6px; padding: 7px 13px; font: inherit; cursor: pointer; text-decoration: none; }
.boton:hover, .boton.activa { border-color: var(--oro); }
.boton.activa { color: var(--oro); font-weight: 700; }
.boton small { display: block; color: var(--suave); font-size: 11px; font-weight: 400; }
.marco { width: 100%; height: 80vh; min-height: 520px; border: 1px solid var(--borde); border-radius: 8px; background: var(--panel2); display: block; }
</style>
</head>
<body>
<main id="main">
  <h1>Mapa de cubos ocultos</h1>
  <p class="sub">Toca un punto para marcarlo como abierto. Arrastra para moverte y usa + / − para acercar.</p>
  <div class="mapas" id="mapas">
    <button class="boton" data-m="verteron">Verteron<small>Elyos</small></button>
    <button class="boton" data-m="altgard">Altgard<small>Asmodianos</small></button>
    <a class="boton" id="completa" href="#" target="_blank" rel="noopener">Abrir en pantalla completa ↗</a>
  </div>
  <iframe class="marco" id="marco" title="Mapa de cubos ocultos" loading="lazy"></iframe>
</main>
<script src="js/comun.js?v=7"></script>
<script>
(function () {
  cabecera("mapa");
  var URL = "https://aion2atlas.app/map/{m}/hidden-cube/";
  var marco = document.getElementById("marco"), completa = document.getElementById("completa");
  var botones = document.querySelectorAll("#mapas button");
  function elegir(m) {
    var u = URL.replace("{m}", m);
    if (marco.src !== u) marco.src = u;
    completa.href = u;
    botones.forEach(function (b) { b.classList.toggle("activa", b.dataset.m === m); });
    try { localStorage.setItem("mapa-cubos", m); } catch (e) {}
  }
  botones.forEach(function (b) { b.onclick = function () { elegir(b.dataset.m); }; });
  var m = "verteron";
  try { m = localStorage.getItem("mapa-cubos") || m; } catch (e) {}
  elegir(m === "altgard" ? "altgard" : "verteron");
})();
</script>
</body>
</html>
